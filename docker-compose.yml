services:
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.development
    depends_on:
      - db
    # Perintah ini akan diteruskan ke entrypoint.sh sebagai argumen
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    
  db:
    image: mysql:8.0
    cap_add:
      - SYS_NICE # Diperlukan untuk MySQL 8
    restart: always
    environment:
      MYSQL_DATABASE: ${DEV_DB_NAME}
      MYSQL_USER: ${DEV_DB_USER}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD} # Tambahkan ini di .env Anda
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: